name: Frontend CI (Push)

on:
  workflow_dispatch:
  push:
    branches-ignore: [ master ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_frontend_quick:
    name: "[Build] Frontend quick build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Quick frontend build
        run: npm run build

  frontend_sbom_generation:
    name: "[Security] Frontend SBOM generation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build_frontend_quick
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate frontend SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file bom.json
      - name: Upload frontend SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/bom.json
          if-no-files-found: error
