name: Frontend CI (Push)

on:
  workflow_dispatch:
  push:
    branches-ignore: [ master ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_frontend_quick:
    name: "[Build] Frontend quick build"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Quick frontend build
        run: npm run build

  frontend_sbom_generation:
    name: "[Security] Frontend SBOM generation"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    needs: build_frontend_quick
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Generate frontend SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file bom.json
