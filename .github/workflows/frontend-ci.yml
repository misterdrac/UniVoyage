name: Frontend CI (Push)

on:
  workflow_dispatch:
  push:
    branches-ignore: [ master ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_frontend_quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Quick frontend build
        run: npm run build

  npm_audit_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build_frontend_quick
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (high+critical)
        run: npm audit --audit-level=high

  trivy_frontend_fs_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: npm_audit_frontend
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan for frontend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
