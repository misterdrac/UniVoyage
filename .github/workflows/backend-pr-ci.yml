name: Backend CI (Pull Request)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-pr-ci.yml"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code_format_validate:
    name: "[Security] Backend code format validate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Validate code formatting
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress formatter:validate

  validate_backend:
    name: "[Build] Backend Maven validate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: code_format_validate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Validate Maven project
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress validate

  build_backend:
    name: "[Build] Backend package"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate_backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Build backend (skip tests)
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress -DskipTests clean package

  test_backend:
    name: "[Test] Backend tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build_backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: univoyage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d univoyage_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/univoyage_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/univoyage_test
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-pr
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
          if-no-files-found: ignore

  sbom_generation_pr:
    name: "[Security] Backend SBOM generation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build_backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Generate SBOM (CycloneDX)
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-pr
          path: |
            backend/target/bom.xml
            backend/target/bom.json
          if-no-files-found: error

  build_backend_docker_pr:
    name: "[Docker] Backend Docker build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test_backend
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t univoyage-backend:pr-${{ github.sha }} ./backend
      - name: Save Docker image as artifact
        run: docker save univoyage-backend:pr-${{ github.sha }} -o backend-pr-image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image-pr
          path: backend-pr-image.tar
          if-no-files-found: error

  trivy_pom_scan_pr:
    name: "[Security] Backend Trivy pom scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build_backend_docker_pr, sbom_generation_pr]
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan for pom.xml
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: backend/pom.xml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  trivy_docker_scan_pr:
    name: "[Security] Backend Trivy image scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trivy_pom_scan_pr
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image-pr
      - name: Load Docker image
        run: docker load -i backend-pr-image.tar
      - name: Trivy scan for Docker image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: univoyage-backend:pr-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  trivy_backend_codebase_scan_pr:
    name: "[Security] Backend Trivy codebase scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: trivy_docker_scan_pr
    steps:
      - uses: actions/checkout@v4
      - name: Trivy full backend codebase scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  dependency_review_pr:
    name: "[Security] Backend dependency review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
