name: Master Pipeline

on:
  push:
    branches: [ master ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/master-pipeline.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (example: v1.2.3)"
        required: false
        type: string

permissions:
  contents: write
  security-events: write

concurrency:
  group: master-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_format_validate:
    name: "[Security] Backend code format validate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Validate code formatting
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress formatter:validate

  build_java_project:
    name: "[Build] Backend Java project"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: code_format_validate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Build Java project (skip tests)
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress -DskipTests clean package

  run_backend_tests:
    name: "[Test] Backend tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build_java_project
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: univoyage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d univoyage_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/univoyage_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/univoyage_test
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress test
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-main-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
          if-no-files-found: ignore

  build_backend_docker:
    name: "[Docker] Backend Docker build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: run_backend_tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t univoyage-backend:main-${{ github.sha }} ./backend
      - name: Save Docker image as artifact
        run: docker save univoyage-backend:main-${{ github.sha }} -o backend-main-image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-main-docker-image
          path: backend-main-image.tar
          if-no-files-found: error

  sbom_generation:
    name: "[Security] Backend SBOM generation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build_java_project
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Generate SBOM (CycloneDX)
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-main-sbom
          path: |
            backend/target/bom.xml
            backend/target/bom.json
          if-no-files-found: error

  trivy_pom_scan:
    name: "[Security] Backend Trivy pom scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build_backend_docker, sbom_generation]
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan for pom.xml
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: backend/pom.xml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  trivy_docker_scan:
    name: "[Security] Backend Trivy image scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trivy_pom_scan
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-main-docker-image
      - name: Load Docker image
        run: docker load -i backend-main-image.tar
      - name: Trivy scan for Docker image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: univoyage-backend:main-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  frontend_build:
    name: "[Build] Frontend build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  frontend_security_scan:
    name: "[Security] Frontend security scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend_build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (high+critical)
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan for frontend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  codebase_security_scan:
    name: "[Security] Codebase security scan (manual)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    needs: [trivy_docker_scan, frontend_security_scan]
    steps:
      - uses: actions/checkout@v4
      - name: Owner-only guard for manual jobs
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "Only repository owner can run manual codebase/tag/release jobs."
            exit 1
          fi
      - name: Trivy full backend codebase scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  create_tag:
    name: "[Release] Create tag (manual)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: codebase_security_scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Owner-only guard for manual jobs
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "Only repository owner can run manual codebase/tag/release jobs."
            exit 1
          fi
      - name: Create and push release tag
        run: |
          git tag "${{ inputs.release_tag }}"
          git push origin "${{ inputs.release_tag }}"

  create_release:
    name: "[Release] Create GitHub release (manual)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: create_tag
    steps:
      - uses: actions/checkout@v4
      - name: Owner-only guard for manual jobs
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "Only repository owner can run manual codebase/tag/release jobs."
            exit 1
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Release ${{ inputs.release_tag }}
          generate_release_notes: true
