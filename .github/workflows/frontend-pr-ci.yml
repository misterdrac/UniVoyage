name: Frontend CI (Pull Request)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pr-ci.yml"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install_dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci

  lint_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install_dependencies
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  npm_audit_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install_dependencies
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (high+critical)
        run: npm audit --audit-level=high

  trivy_frontend_fs_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install_dependencies
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan for frontend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  build_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint_frontend, npm_audit_frontend, trivy_frontend_fs_scan]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
