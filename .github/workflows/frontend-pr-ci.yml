name: Frontend CI (Pull Request)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pr-ci.yml"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency_review_pr:
    name: "[Security] Frontend dependency review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Dependency check (npm audit high+critical)
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

  install_dependencies:
    name: "[Build] Frontend install dependencies"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci

  lint_frontend:
    name: "[Test] Frontend lint"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    needs: install_dependencies
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  format_frontend:
    name: "[Test] Frontend format check"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    needs: install_dependencies
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,scss,md,json}"

  npm_audit_frontend:
    name: "[Security] Frontend npm audit"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    needs: install_dependencies
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (high+critical)
        run: npm audit --audit-level=high

  trivy_frontend_fs_scan:
    name: "[Security] Frontend Trivy fs scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install_dependencies
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy filesystem scan for frontend
        run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 frontend

  build_frontend:
    name: "[Build] Frontend build"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 15
    needs: [lint_frontend, format_frontend, npm_audit_frontend, trivy_frontend_fs_scan]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  build_frontend_artifact:
    name: "[Build] Frontend build artifact"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 15
    needs: build_frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Build frontend artifact
        run: npm run build
  frontend_sbom_generation_pr:
    name: "[Security] Frontend SBOM generation"
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    needs: build_frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Generate frontend SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file bom.json
  trivy_frontend_dist_scan:
    name: "[Security] Frontend Trivy dist scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build_frontend_artifact, frontend_sbom_generation_pr]
    steps:
      - name: Clone repository
        working-directory: .
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Rebuild frontend dist
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy scan built frontend artifact
        run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 frontend/dist
