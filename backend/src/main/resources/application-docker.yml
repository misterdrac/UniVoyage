spring:
  main:
    banner-mode: console

  banner:
    location: classpath:banner.txt
    charset: UTF-8

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL}
    user: ${SPRING_FLYWAY_USER:${POSTGRES_USER:postgres}}
    password: ${SPRING_FLYWAY_PASSWORD:${POSTGRES_PASSWORD}}
    connect-retries: 10
    connect-retries-interval: 5
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

# Log4j2 appenders + rollover: classpath log4j2.xml (this stack uses spring-boot-starter-log4j2, not Logback).
# File directory in Docker: LOG_DIR=/app/logs (see docker-compose). Sizes/history: LOG_FILE_MAX_SIZE, LOG_ROLLING_MAX_FILES.
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.univoyage: ${LOGGING_LEVEL_COM_UNIVOYAGE:DEBUG}

# Outbound email uses Resend/Postmark/etc., not JavaMail SMTP — disable SMTP health check.
management:
  health:
    mail:
      enabled: false
