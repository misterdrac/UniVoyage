<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{productName}}</title>
  <!--[if mso]><style type="text/css">body,table,td{font-family:Arial,Helvetica,sans-serif!important;}</style><![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f8f7fc;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f8f7fc;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:480px;border-collapse:separate;background-color:#ffffff;border-radius:12px;border:1px solid #e7e5ef;box-shadow:0 4px 10px rgba(62,54,89,0.08),0 1px 2px rgba(62,54,89,0.06);">
          <tr>
            <td style="height:4px;background-color:#7c5ce7;border-radius:12px 12px 0 0;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:32px 28px 8px 28px;">
{{body}}
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px 28px;text-align:center;font-size:12px;color:#78718f;line-height:1.6;">
              <span style="color:#7c5ce7;font-weight:600;">{{productName}}</span><br>
              Student travel made easy
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
