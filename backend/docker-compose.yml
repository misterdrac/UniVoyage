# docker-json rotation for stdout/stderr (separate from app/file logs under ./logs/).
x-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    container_name: univoyage_db_container
    restart: unless-stopped
    env_file: .env
    # Default 5433: on Windows, 5432 is often blocked (Hyper-V / excluded port ranges).
    # Override in .env: POSTGRES_HOST_PORT=5432 when 5432 is free on your machine.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    logging: *json-file-logging
    command: >
      postgres
      -c logging_collector=on
      -c log_destination=stderr
      -c log_directory=/var/log/postgresql
      -c log_filename=postgresql-%Y%m%d.log
      -c log_truncate_on_rotation=on
      -c log_rotation_age=1d
      -c log_rotation_size=50MB
      -c log_min_messages=${POSTGRES_LOG_MIN_MESSAGES:-info}
      -c log_min_error_statement=error
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement=${POSTGRES_LOG_STATEMENT:-none}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d univoyage_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: univoyage_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-univoyage_db}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-univoyage_db}
      LOG_DIR: /app/logs
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_UNIVOYAGE: ${LOGGING_LEVEL_COM_UNIVOYAGE:-DEBUG}
      LOG_FILE_MAX_SIZE: "${LOG_FILE_MAX_SIZE:-10 MB}"
      LOG_ROLLING_MAX_FILES: "${LOG_ROLLING_MAX_FILES:-14}"
    volumes:
      - ./logs/backend:/app/logs
    logging: *json-file-logging
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
